    <script>
        // Applies the stored theme before first paint. Without this, React only
        // adds .dark in an effect and dark-mode users get a white flash.
        try {
            var saved = localStorage.getItem('cv-dark');
            var dark = saved != null ? saved === '1' : matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
            var lang = localStorage.getItem('cv-lang');
            if (lang) document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        } catch (e) {
        }
    </script>
